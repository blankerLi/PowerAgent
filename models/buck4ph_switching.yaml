# =============================================================================
# buck4ph_switching.yaml —— 4 相同步 Buck 的「开关模型」拓扑与工作点定义
#
# model.yaml 中 model_package.switching.entry 指向本文件。与平均模型的区别只在
# 是否显式建模 PWM 开关动作：本模型逐开关周期求解，产生真实的输出纹波与相电流
# 三角波，代价是仿真步长受开关频率约束，比平均模型慢 1~2 个数量级。
#
# 由此形成分层执行的成本梯度（design.md §8）：screening 层用平均模型快速筛除
# 明显不可行的候选，只有通过筛选的候选才进入 evaluation 层的开关模型。
#
# 功率级与工作点必须与 buck4ph_averaged.yaml 逐项一致——两者是同一个电路的
# 两种保真度，不是两个电路。不一致会让分层执行的筛除结论失去意义。
# =============================================================================

topology: buck_multiphase_synchronous
model_variant: switching

power_stage:
  n_phase: 4
  fsw_hz: 500.0e3
  l_per_phase_h: 150.0e-9
  cout_f: 2.0e-3
  cout_esr_ohm: 0.5e-3
  dcr_per_phase_ohm: 0.4e-3
  rds_on_ohm: 1.2e-3

operating_point:
  vin_nom_v: 12.0
  vout_nom_v: 0.8
  iout_nom_a: 200.0

control:
  scheme: voltage_mode
  compensator: type_ii_gm
  gm_s: 2.0e-3
  vramp_v: 1.0

modulator:
  # 平均模型中不存在的部分：显式 PWM 与相位交错
  phase_shift_deg: 90.0         # 360 / n_phase
  duty_min: 0.005               # 最小占空比钳位
  duty_max: 0.95                # 最大占空比钳位
  dead_time_s: 20.0e-9          # 上下管死区

solver:
  python_method: BDF
