[project]
name = "poweragent"
version = "0.2.0"
description = "LLM 驱动的多相 Buck 供电模块参数寻优 Agent（确定性域 / LLM 域 / 仿真域三信任域架构）"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.*",
    "PyYAML==6.*",
    "Jinja2==3.*",
    "numpy==1.26.*",
    "scipy==1.11.*",
    "matplotlib==3.8.*",
    "click==8.*",
    "openai==1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-cov==5.*",
]

[project.scripts]
poweragent = "poweragent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认排除 live_llm：那些测试会真实调用 LLM，慢、消耗额度、且可能因网络波动而失败，
# 不该出现在默认测试路径里。需要时显式选择：`pytest -m live_llm`（命令行的 -m 会
# 覆盖这里的设置）。仅靠"有没有 API Key"来决定跑不跑是不够的——本地配了 .env 之后
# 每次跑测试都会连网。
addopts = ["--strict-markers", "-q", "-m", "not live_llm"]
# 不按类名收集测试。本项目的测试全是函数式，而默认的 `Test*` 规则会把领域类型
# （如 agent.state.TestedPoint）误认作测试类并发出收集警告。改配置比给领域类型加
# 一个 `__test__ = False` 干净：领域类型不该知道测试框架的存在。
python_classes = []
markers = [
    "unit: 纯函数确定性断言（配置校验、哈希、排序、校验器）",
    "sim: Python 仿真后端的物理性质（跑数值求解，秒级）",
    "metric: 指标计算 —— 固定波形资产 + 人工公式核对",
    "agent: LLM 域 —— 契约与失败路径，使用假 client，不发网络请求",
    "integration: 单候选闭环 —— 使用 Python 仿真后端，无需 MATLAB",
    "matlab: 需要 MATLAB + Simulink 许可证，CI 中跳过",
    "live_llm: 需要 POWERAGENT_LLM_API_KEY，会真实发网络请求，默认跳过",
]
