# =============================================================================
# constraints.yaml —— 硬约束与设计空间
#
# Owner：电源设计
# 追溯: design.md §4.4；requirements.md R3.9, R22.1/R22.2(device_limits 作为唯一权威来源);
#       tasks.md 5.7 / 5.1
#
# 数值来源声明（诚实口径，勿在面试中夸大）：本阶段为仿真轨
# （task.simulation_only=true），下列物理数值是自洽的设计假设，量级取自低压大电流
# AI 芯片核心供电的常见区间，**没有绑定任何实测记录或具体 datasheet 页码**。
# 因此结论的效力止于「在该假设电路上，搜索方法是否有效」，不构成选型或打板依据。
# =============================================================================

# ===== 本节变更需重新审批（M0 出口冻结） =====
# 恰五条，不接受第六条；每条恰含 value / observable / sense({lower,upper}) / applies_to_tier 四字段
# 第五条 gain_margin_min 由一次参考扫描的结果引入，变更理由见 requirements.md AC1 的变更记录
hard_constraints:
  vout_min:
    value: 0.75                           # unit: V · 标称 0.8 V 下沉 6.25%，覆盖负载阶跃下冲全窗口
    observable: obs.vout_min              # 取自 metrics.yaml constraint_observables
    sense: lower                          # 值 >= value 判满足
    applies_to_tier: [screening, evaluation]
  vout_max:
    value: 0.85                           # unit: V · 标称 0.8 V 上冲 6.25%，防卸载过压损伤负载
    observable: obs.vout_max
    sense: upper                          # 值 <= value 判满足
    applies_to_tier: [screening, evaluation]
  peak_current_max:
    value: 55.0                           # unit: A · 阶跃终值 150 A / 4 相 = 37.5 A 均值，
                                          # 叠加约 ±5 A 开关纹波后留余量给瞬态过冲；
                                          # 整定过激的候选会因电流过冲越过此限
    observable: phase_peak_current
    sense: upper
    applies_to_tier: [screening, evaluation]
  phase_margin_min:
    value: 45.0                           # unit: deg · 经典稳定性判据；低于此值瞬态易出现振铃
    observable: phase_margin
    sense: lower
    applies_to_tier: [evaluation]
  gain_margin_min:
    value: 6.0                            # unit: dB · 与上面的 45 deg 同属一套经典判据（45°/6dB）。
                                          # 缺这一条时参考扫描的最优点落在 rcomp=65793 Ω 的角点上，
                                          # 增益裕量仅 1.917 dB —— 形式上满足其余四条、实际接近失稳。
                                          # 本电路的增益裕量只随 rcomp 变化、与 ccomp 无关：rcomp 增大
                                          # 使高频开环增益趋于常数 Rc·gm·ESR/Ri（ESR 零点令增益不再
                                          # 滚降），因此这一条约束的作用是给设计域定上界，与
                                          # phase_margin_min 定下界互补。
    observable: gain_margin
    sense: lower
    applies_to_tier: [evaluation]
# =============================================================================

design_space:                             # 变更频率高于硬约束节
  variables:
    rcomp:
      unit: ohm
      domain: [1000.0, 100000.0]           # unit: ohm · 1 kΩ ~ 100 kΩ，覆盖 Type-II 补偿常用区间
      scale: log
      ticks: { count: 12, spacing: log }   # 12 档等比，相邻比 = 100^(1/11) ≈ 1.5198
    ccomp:
      unit: F
      domain: [1.0e-10, 1.0e-8]            # unit: F · 100 pF ~ 10 nF
      scale: log
      ticks: { count: 12, spacing: log }   # 12 档等比；与 rcomp 合成 12 × 12 = 144 点参考网格

  novelty_min_ticks: 1.0                  # unit: 无量纲(档位距离) · 探索阶段最小档位距离
                                          # Dense Grid 走 mode='grid' 跳过新颖度检查

  tick_match_rel_tol: 1e-6                # unit: 无量纲相对容差 · 档位命中的相对容差
                                          # 约束: 须严格小于 0.01 × (tick_ratio − 1) = 5.2e-3 ✓

  device_limits:                          # 关键器件参数，唯一权威来源（design.md §4.4；R22.1/R22.2）
                                          # 三项须与 models/buck4ph_*.yaml 的 power_stage 节逐项一致
    cout_c:
      value: 6.0e-3                       # unit: F · 6 mF 输出电容总容值。负载阶跃下冲
                                          # ≈ ΔI·t_response/Cout，是瞬态性能的首要器件
      source: "仿真轨设计假设（未绑定 datasheet 或实测）；量级依据：低压大电流 VRM 输出电容常见总容值区间"
    cout_esr:
      value: 0.15e-3                      # unit: ohm · 0.15 mΩ 等效 ESR；ESR 零点 ≈ 177 kHz。
                                          # 取小值以压低 ESR·ΔI 的瞬时压降；相位补偿
                                          # 由电流内环承担而非 ESR 零点
      source: "仿真轨设计假设（未绑定 datasheet 或实测）；量级依据：多颗低 ESR 聚合物/陶瓷电容并联后的等效值区间"
    l_per_phase:
      value: 150.0e-9                     # unit: H · 150 nH/相。电流模式下它位于电流内环
                                          # 内部，对电压外环的作用由内环带宽概括；
                                          # 开关模型用它计算相电流纹波
      source: "仿真轨设计假设（未绑定 datasheet 或实测）；量级依据：500 kHz 多相 Buck 每相电感常见取值区间"
